name: FamGuard CI

on:
  push:
    branches: [appjet]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify PWA assets are included in production output
        run: |
          test -f dist/public/manifest.webmanifest
          test -f dist/public/sw.js
          test -f dist/public/icons/famguard.svg
